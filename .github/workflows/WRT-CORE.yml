#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean
      WRT_CLEAN:
        description: '编译前执行 make clean（清空 build_dir）。默认 false，保留增量缓存。'
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_ROOT: /mnt/wrt
  CCACHE_MAXSIZE: 50G
  WRT_CLEAN: ${{inputs.WRT_CLEAN}}
  CCACHE_DIR: /mnt/wrt/ccache
  GOCACHE: /mnt/wrt/go/build
  GOMODCACHE: /mnt/wrt/go/mod
  GOFLAGS: -buildvcs=false
  CCACHE_SLOPPINESS: "time_macros,include_file_mtime,include_file_ctime,file_macro"
  CCACHE_NOHASHDIR: "1"
  WRT_PKG_CACHE: /mnt/wrt/pkgcache

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: self-hosted
    concurrency:
      group: wrt-selfhosted      # 全局唯一，所有构建排队执行
      cancel-in-progress: false
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          RUN_USER="$(id -un)"
          RUN_GROUP="$(id -gn)"
          sudo mkdir -p "$WRT_ROOT/src" "$WRT_ROOT/dl" "$WRT_ROOT/ccache" "$WRT_ROOT/go"
          # 裸金属持久化缓存目录可达几十 GB，递归 chown -R 每次要扫描整棵树；
          # 仅对顶层目录修正属主，子目录由 runner 用户自行创建，天然归属正确
          for DIR in "$WRT_ROOT" "$WRT_ROOT/src" "$WRT_ROOT/dl" "$WRT_ROOT/ccache" "$WRT_ROOT/go"; do
            [ "$(stat -c %U "$DIR")" = "$RUN_USER" ] || sudo chown "$RUN_USER:$RUN_GROUP" "$DIR"
          done
          unset LD_LIBRARY_PATH LD_PRELOAD

          # Debian 宿主机依赖自检：缺工具时提前告警，避免编译中后期深处失败浪费缓存
          DEPS_MISSING=""
          for t in git ccache g++ make file python3 jq dos2unix; do
            command -v "$t" > /dev/null || DEPS_MISSING="$DEPS_MISSING $t"
          done
          if [ -n "$DEPS_MISSING" ]; then
            echo "::warning::缺少编译依赖:$DEPS_MISSING (Debian: sudo apt install -y git ccache build-essential file python3 jq dos2unix)"
          fi

          # 基础工具自检：sed 挂掉会导致 prepare-tmpinfo 必失败
          for t in sed find xargs awk grep; do
            command -v "$t" > /dev/null || { echo "::error::$t missing"; exit 1; }
          done
          echo abc | sed 's/a/X/' | grep -q Xbc || {
            echo "::error::sed broken (glibc mismatch)"; exit 1; }

          command -v ccache > /dev/null && { ccache -M "$CCACHE_MAXSIZE"; ccache -z; } || true
          df -h "$WRT_ROOT"

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=wifi-yes"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Sync Code
        id: sync-code
        run: |
          set -e
          SRC="$WRT_ROOT/src-${WRT_SOURCE//\//-}-${WRT_BRANCH//\//-}"
          
          if [ -d "$SRC/.git" ]; then
            cd "$SRC"
            git remote set-url origin "$WRT_REPO"
            git fetch --depth=1 --force origin "$WRT_BRANCH"
            git reset --hard FETCH_HEAD
          else
            rm -rf "$SRC"
            git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" "$SRC"
            cd "$SRC"
          fi
          
          # 清掉上次构建残留，但保留 feeds / staging_dir（工具链）
          git clean -ffdx \
            -e feeds -e staging_dir -e build_dir -e tmp -e logs -e bin \
            -e dl -e .ccache -e key-build -e key-build.pub -e key-build.ucert

          # 已知残留内核补丁自愈：上游重做 fwnode PCS 系列后，737-02 已在
          # phylink_create() 时链接 PCS list，旧 737-10 "link before initial
          # config" 被废弃；但 owrt 分支合并时漏删，其 hunk2 要删的代码块在
          # 新 phylink.c 已不存在，打补丁必冲突（kernel-headers 编译中断）。
          # 仅当同目录 737-02 确为新版时才移除；内核升代后 glob 扫所有
          # pending-* 目录仍生效，条件不成立时输出诊断便于排障。
          FOUND_STALE=0
          for STALE10 in target/linux/generic/pending-*/737-10-net-phylink-link-the-PCS-list-*.patch; do
            [ -f "$STALE10" ] || continue
            FOUND_STALE=1
            PENDIR="${STALE10%/*}"
            if grep -qs 'Fill the PCS' "$PENDIR"/737-02-*.patch; then
              echo "removing superseded phylink patch: ${STALE10##*/}"
              rm -f "$STALE10"
            fi
          done
          [ "$FOUND_STALE" = 1 ] || echo "phylink self-heal: no stale 737-10 patch found (ok)"

          # 共享目录软链（若被 clean 掉则重建）
          ln -sfn "$WRT_ROOT/dl"     "$SRC/dl"
          ln -sfn "$WRT_ROOT/ccache" "$SRC/.ccache"
          
          # workspace 软链指向大盘上的持久化源码
          rm -rf "$GITHUB_WORKSPACE/wrt"
          ln -sfn "$SRC" "$GITHUB_WORKSPACE/wrt"
          
          cd "$GITHUB_WORKSPACE/wrt"
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"
          echo "WRT_SRC_DIR=$SRC" >> "$GITHUB_ENV"
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_ENV"
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a

          # feeds 被 git clean 排除、且 feeds update 不会硬重置，需手动还原上次构建打的补丁
          for FEED in ./feeds/*/; do
            [ -d "$FEED/.git" ] && git -C "$FEED" checkout -- . || true
          done

          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/Scripts/Kernel.sh    

          make defconfig -j$(nproc)
          if [[ "${WRT_CLEAN:-false}" == "true" ]]; then
            make clean -j$(nproc)
          fi

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          # 并行下载偶发失败时串行重试一次，dl/ 持久缓存命中后重试成本极低
          make download -j$(nproc) || make download -j1

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          # 用 OpenWrt 自带的 ccache 设置容量（系统 ccache 跟它不是一个）
          if [ -x ./staging_dir/host/bin/ccache ]; then
            CCACHE_DIR="${CCACHE_DIR:-/mnt/wrt/ccache}" ./staging_dir/host/bin/ccache -M "$CCACHE_MAXSIZE"
            CCACHE_DIR="${CCACHE_DIR:-/mnt/wrt/ccache}" ./staging_dir/host/bin/ccache -z
          fi

          mkdir -p "${GOCACHE:-/mnt/wrt/go/build}" "${GOMODCACHE:-/mnt/wrt/go/mod}"

          make -j$(nproc) || make -j1 V=s

          if [ -x ./staging_dir/host/bin/ccache ]; then
            CCACHE_DIR="${CCACHE_DIR:-/mnt/wrt/ccache}" ./staging_dir/host/bin/ccache -s
          fi

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
            # 注意：这里不再做构建后的 make clean ——
            # 若上次开了 WRT_CLEAN，构建前的 clean 已达成全量重编目的；
            # 构建后再 clean 会把本次的热缓存抹掉，导致下次构建也从头重编
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
